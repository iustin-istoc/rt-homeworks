# Copiați acest fișier în config.properties și completați valorile primite la laborator.
# config.properties este în .gitignore: NU îl urcați pe GitHub.
# Orice valoare se poate da și ca variabilă de mediu (STUDENT, CTP_API_KEY, RABBIT_USER, ...).

STUDENT=istoc-iustin

# API REST CTP Cluj live
CTP_API_URL=https://control.aut.utcluj.ro/publictransport
CTP_API_KEY=

# RabbitMQ (exchange fanout cluj.vehicles)
RABBIT_HOST=control.aut.utcluj.ro
RABBIT_PORT=11156
RABBIT_USER=
RABBIT_PASS=

# Brokerul MQTT al cursului
MQTT_URI=tcp://control.aut.utcluj.ro:11188

# Placa: gol = prima placă a lui STUDENT care publică "status"
DEVICE_ID=

# Cât timp îi ia utilizatorului să meargă până la stație (minute)
WALK_MIN=5
